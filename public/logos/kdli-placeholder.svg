<?xml version="1.0" encoding="UTF-8"?>
<!-- v1.1 단계 19.5 [L.4] KDLI 임시 placeholder.
     원본 벡터 자료 입수 시 교체. PNG의 에지 안티앨리어싱 아티팩트를 임시로
     벡터 마크로 대체하기 위한 학술 톤(네이비 + 골드) 모노그램. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="KDLI placeholder logo">
  <title>KDLI</title>
  <desc>Korea Defense Language Institute — placeholder vector mark</desc>
  <!-- 외곽 원 -->
  <circle cx="256" cy="256" r="246" fill="#FBF8F3" stroke="#163A6B" stroke-width="6" />
  <!-- 내부 골드 링 -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#D4A056" stroke-width="3" />
  <!-- 상단 캡션 "KOREA DEFENSE" -->
  <text x="256" y="120" text-anchor="middle"
        font-family="'Pretendard Variable', 'Pretendard', system-ui, sans-serif"
        font-size="28" font-weight="600" fill="#163A6B" letter-spacing="6">
    KOREA DEFENSE
  </text>
  <!-- 메인 모노그램 "KDLI" -->
  <text x="256" y="290" text-anchor="middle"
        font-family="'Pretendard Variable', 'Pretendard', system-ui, sans-serif"
        font-size="148" font-weight="700" fill="#163A6B" letter-spacing="-4">
    KDLI
  </text>
  <!-- 하단 캡션 "LANGUAGE INSTITUTE" -->
  <text x="256" y="380" text-anchor="middle"
        font-family="'Pretendard Variable', 'Pretendard', system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#163A6B" letter-spacing="4">
    LANGUAGE INSTITUTE
  </text>
  <!-- 학술 톤 라이너: 골드 가로 줄 (중앙 모노그램 위) -->
  <line x1="160" y1="160" x2="352" y2="160" stroke="#D4A056" stroke-width="2" />
  <line x1="160" y1="324" x2="352" y2="324" stroke="#D4A056" stroke-width="2" />
</svg>
